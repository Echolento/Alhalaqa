name: Payment Push Timing Engine

# Hourly tick — /api/cron decides by Cairo hour what fires:
# 08:00 digest+email, 10:00 payer nags + escalation, 20:00 digest.
# Idempotency markers make retries safe. Toggle is dead: always on.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoint
        run: |
          curl -s -f \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PRODUCTION_URL }}/api/cron"
